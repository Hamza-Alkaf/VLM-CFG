# Frozen 2,000-item stratified subset of OCRBench v2 (seed 1234, GT capped at 500 words).
# Built by prepare_ocrbench_v2_2k.py; see ocrbench_v2_2k_manifest.json for the exact ids.
dataset_path: !datapath ocrbench_v2_2k
dataset_kwargs:
  load_from_disk: true
task: "ocrbench_v2_2k"
test_split: test
output_type: generate_until
doc_to_visual: !function utils.ocrbench_v2_doc_to_visual
doc_to_text: !function utils.ocrbench_v2_doc_to_text
doc_to_target: "answer"
generation_kwargs:
  # The parent task ships 128, which TRUNCATES the long-form parsing types: document
  # parsing / full-page OCR / table parsing have GTs in the hundreds of words, so a
  # 128-token budget would score them near zero for a reason unrelated to CFG.
  # The 500-WORD GT CAP applied at subset-build time bounds what is needed here:
  # 500 words of structured HTML/markdown is ~1.5-2k tokens, so 2048 covers every kept
  # answer with headroom. Raise both together, never this alone.
  max_new_tokens: 2048
  temperature: 0
  top_p: 1.0
  num_beams: 1
  do_sample: false
process_results: !function utils.ocrbench_v2_process_results
metric_list:
  - metric: ocrbench_v2_accuracy
    aggregation: !function utils.ocrbench_v2_aggregate_accuracy
    higher_is_better: true
metadata:
  - version: 0.0
