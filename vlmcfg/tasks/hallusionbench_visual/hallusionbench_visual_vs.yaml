# HallusionBench, Visual Supplement questions with an image: 360 rows, all figure_ids
# (data/prepare_hallusionbench_visual.py).
dataset_path: parquet
dataset_kwargs:
  data_files:
    test: !datapath hallusionbench_visual/hallusionbench_visual_vs.parquet
  token: True
task: "hallusionbench_visual_vs"
test_split: test
output_type: generate_until

doc_to_visual: !function hb_utils.hb_doc_to_visual
doc_to_text: !function hb_utils.hb_doc_to_text
doc_to_target: "answer"

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    # Leading space, no newline: f"{question} Answer with [yes/no] single word only".
    # Scoring is a whole-string exact match, so this instruction is what keeps the
    # metric meaningful -- see hb_utils.hb_process_results.
    post_prompt: " Answer with [yes/no] single word only"

generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  do_sample: False

process_results: !function hb_utils.hb_process_results

metric_list:
  - metric: hb_accuracy
    aggregation: !function hb_utils.hb_aggregate_accuracy
    higher_is_better: true

metadata:
  - version: 0.0
