dataset_path: parquet
dataset_kwargs:
  data_files:
    test: !datapath openimages/openimages.parquet
  token: True
task: "openimages"
test_split: test
output_type: generate_until
doc_to_visual: !function openimages_utils.openimages_doc_to_visual
doc_to_text: !function openimages_utils.openimages_doc_to_text
doc_to_target: !function openimages_utils.openimages_doc_to_target

lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    post_prompt: "\nAnswer with the exact word or phrase only, with no explanation."

generation_kwargs:
  max_new_tokens: 32
  temperature: 0
  do_sample: False

process_results: !function openimages_utils.openimages_process_results

metric_list:
  - metric: exact_match
    aggregation: !function openimages_utils.openimages_aggregate_mean
    higher_is_better: true
  - metric: anls
    aggregation: !function openimages_utils.openimages_aggregate_mean
    higher_is_better: true

metadata:
  - version: 0.0
